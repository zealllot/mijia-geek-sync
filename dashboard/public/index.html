<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模式看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%234ade9a'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%234ade9a' stroke-opacity='.3' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* 仪表盘的语言：绿=自动化通，蓝=够亮了（不是毛病），橙=受阻，灰=未配置。
   字体全用 macOS 自带的 —— 引网络字体会让断网时页面塌掉。 */
:root {
  color-scheme: dark;
  --ground: #0d1013;
  --panel: #141a1f;
  --panel-dim: #101418;
  --line: #222b31;
  --line-dim: #1a2126;
  --ink: #c8d2d8;
  --ink-hi: #e6edf1;
  --dim: #61727c;
  --faint: #46545c;
  --ghost: #3a454d;
  --ok: #4ade9a;
  --bright: #6b93b0;
  --alert: #d97757;
  --off: #2a343a;
  --mono: "SF Mono", Menlo, ui-monospace, monospace;
  --sans: "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--ground); color: var(--ink); font: 12px/1.6 var(--mono); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; position: relative; z-index: 1; }

/* 背景层。放在最底下、固定不动，模糊和变暗都加在它身上而不是内容上。 */
#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#bg .img { position: absolute; inset: -60px; background: center/cover no-repeat; }
#bg .veil { position: absolute; inset: 0; background: #000; }

/* ---------- 编辑模式 ---------- */
body.editing { user-select: none; }
body.editing .room, body.editing .tile { cursor: move; }
body.editing .room::after, body.editing .tile::after {
  content: ""; position: absolute; right: 0; bottom: 0; width: 14px; height: 14px;
  cursor: nwse-resize; background:
    linear-gradient(135deg, transparent 50%, var(--bright) 50%, var(--bright) 68%, transparent 68%);
  opacity: .75;
}
body.editing .room:hover, body.editing .tile:hover { border-color: var(--bright); }
.dragging { opacity: .85; box-shadow: 0 6px 24px #0008; z-index: 5; }

.editbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 11px 22px; background: #16202a; border-bottom: 1px solid var(--bright);
  font-size: 11px; letter-spacing: .14em; color: var(--ink);
}
.editbar .grow { flex-grow: 1; }
.editbar input[type=range] { width: 96px; accent-color: var(--bright); vertical-align: middle; }
.editbar input[type=color] { width: 30px; height: 24px; padding: 0; border: 1px solid var(--line); background: none; }
.editbar label { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: 10.5px; }
.editbar .btn-s {
  background: none; border: 1px solid var(--line); color: var(--ink); padding: 6px 13px;
  cursor: pointer; font: inherit; font-size: 10.5px; letter-spacing: .14em;
}
.editbar .btn-s:hover { border-color: var(--bright); }
.editbar .btn-s.go { background: var(--ok); border-color: var(--ok); color: #0b1710; }
.zh { font-family: var(--sans); }

/* ---------- 顶栏 / 底栏 ---------- */
.bar {
  display: flex; align-items: center; gap: 13px; padding: 12px 22px;
  background: var(--panel); font-size: 11px; letter-spacing: .16em; color: var(--dim);
}
.bar.top { border-bottom: 1px solid var(--line); }
.bar.bot { border-top: 1px solid var(--line); font-size: 9.5px; color: var(--faint); gap: 20px; }
.bar .grow { flex-grow: 1; }
.bar .sep { color: #2e3941; }
.led { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.led.ok     { background: var(--ok);     box-shadow: 0 0 7px #4ade9a88; }
.led.bright { background: var(--bright); box-shadow: 0 0 7px #6b93b088; }
.led.alert  { background: var(--alert);  box-shadow: 0 0 9px var(--alert); }
.led.dead   { background: var(--off); }
.led.sm { width: 6px; height: 6px; }

/* ---------- 结论带 ---------- */
.band { padding: 20px 22px 18px; border-bottom: 1px solid var(--line-dim); background: linear-gradient(#12181d, var(--ground)); }
.band .where { font-size: 10px; letter-spacing: .26em; color: #55656e; margin-bottom: 10px; }
.band .say { font-family: var(--sans); font-size: clamp(20px, 3vw, 29px); line-height: 1.38; color: var(--ink-hi); letter-spacing: .01em; }
.band .also { margin-top: 11px; font-size: 10.5px; letter-spacing: .14em; color: var(--bright); }

/* ---------- 主体 ---------- */
.body { display: flex; gap: 22px; padding: 20px 22px; align-items: flex-start; flex-wrap: wrap; }
.cap { font-size: 10px; letter-spacing: .26em; color: var(--faint); margin-bottom: 11px; }
.col { min-width: 0; }
.col.plan { flex: 0 0 auto; }
.col.detail { flex: 1 1 340px; max-width: 660px; }

/* ---------- 房间格 ---------- */
.plan-grid { position: relative; overflow-x: auto; max-width: 100%; }
.room {
  position: absolute;
  background: var(--panel); border: 1px solid var(--line); padding: 12px 13px; cursor: pointer;
  /* 垂直居中而不是顶天立地 —— 跨行的房间块（主卧那种）中间会空一大片。 */
  display: flex; flex-direction: column; justify-content: center; gap: 9px; min-height: 76px;
  transition: border-color .2s ease, background .2s ease;
  font: inherit; color: inherit; text-align: left;
}
.room:hover { border-color: #33414b; }
.room:focus-visible { outline: 2px solid var(--bright); outline-offset: 2px; }
.room .nm { display: flex; align-items: center; gap: 7px; }
.room .nm b { font-family: var(--sans); font-size: 15px; font-weight: 400; color: var(--ink); }
.room .st { font-size: 10.5px; letter-spacing: .12em; color: var(--faint); }
.room .lx { font-size: 9.5px; letter-spacing: .1em; color: #3f4c55; }

.room.bright { border-color: #2b3a44; }
.room.bright .st { color: var(--bright); }
.room.blocked {
  background: #1a1512; border: 1.5px solid var(--alert); box-shadow: inset 0 0 34px #d9775722;
}
.room.blocked .nm b { color: #f7ece7; font-weight: 500; }
.room.blocked .st { color: var(--alert); }
.room.unconfigured { background: var(--panel-dim); border: 1px dashed #202830; cursor: default; }
.room.unconfigured .nm b { color: #4f5c65; }
.room.unconfigured .st { color: var(--ghost); }
.room.unknown { border-color: var(--alert); }
.room.unknown .st { color: var(--alert); }
.room.sel { box-shadow: inset 0 0 0 1px var(--bright); }

.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 9.5px; letter-spacing: .1em; color: var(--faint); }
.legend span { display: flex; align-items: center; gap: 6px; }

/* ---------- 闸门链 ---------- */
.gate { background: var(--panel); border: 1px solid var(--line); padding: 10px 13px; display: flex; align-items: center; gap: 10px; }
.gate + .gate { margin-top: 5px; }
.gate .g-name { font-family: var(--sans); font-size: 13px; color: var(--ink); flex: 0 0 130px; }
.gate .g-ref { font-size: 10.5px; color: var(--faint); flex-grow: 1; word-break: break-all; }
.gate .g-note { font-size: 10.5px; letter-spacing: .1em; color: var(--faint); white-space: nowrap; }
.gate.break { background: #1a1512; border-color: #d9775788; box-shadow: inset 0 0 22px #d9775718; }
.gate.break .g-name { color: #f2e6e1; } .gate.break .g-note { color: var(--alert); }
.gate.skip, .gate.fail { background: #0f1317; border-color: #1b2228; }
.gate.fail .g-name { color: var(--dim); }
.gate.skip .g-name { color: #5c6970; } .gate.skip .g-ref, .gate.skip .g-note { color: var(--ghost); }
.gate.fail .g-note { color: var(--bright); }
.gate.missing { border-color: var(--alert); } .gate.missing .g-note { color: var(--alert); }
.note { margin-top: 14px; font-size: 9.5px; line-height: 1.8; color: #3f4c55; letter-spacing: .06em; }

/* 可改的阈值：唯一会写规则图的东西，所以给它一个「这不是普通显示」的样子。 */
.thr {
  background: none; border: 1px dashed #33414b; color: inherit; font: inherit;
  padding: 1px 6px; margin: 0 1px; cursor: pointer; border-radius: 2px;
}
.thr:hover { border-color: var(--bright); border-style: solid; color: var(--ink-hi); }
.thr:focus-visible { outline: 2px solid var(--bright); outline-offset: 2px; }
.thr-edit {
  width: 66px; background: var(--ground); border: 1px solid var(--bright); color: var(--ink-hi);
  font: inherit; text-align: right; padding: 2px 5px; outline: none; -moz-appearance: textfield;
}
.thr-edit::-webkit-outer-spin-button, .thr-edit::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* ---------- 模式开关 ---------- */
.tiles { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); }
.tiles.placed { display: block; position: relative; overflow-x: auto; max-width: 100%; }
.tiles.placed .tile { position: absolute; }
.tile {
  background: var(--panel); border: 1px solid var(--line); padding: 11px 12px;
  display: flex; align-items: center; gap: 9px; font: inherit; color: inherit; text-align: left;
}
.tile .t { flex-grow: 1; font-family: var(--sans); font-size: 13px; color: var(--ink); }
.tile .v { font-size: 12px; color: var(--dim); white-space: nowrap; }
.tile.on .v { color: var(--ok); }
.tile.act { cursor: pointer; }
.tile.act:hover { border-color: #33414b; }
.tile.act:focus-visible { outline: 2px solid var(--bright); outline-offset: 2px; }
.tile.act[aria-busy="true"] { opacity: .45; cursor: wait; }
.tile.bad { border-color: var(--alert); } .tile.bad .v { color: var(--alert); }
.tile .v .u { color: var(--faint); font-size: 10.5px; margin-left: 3px; }
.tile.editing { border-color: var(--bright); }
.tile .edit {
  width: 76px; background: var(--ground); border: 1px solid var(--bright); color: var(--ink-hi);
  font: 400 13px/1 var(--mono); text-align: right; padding: 6px 8px; outline: none; -moz-appearance: textfield;
}
.tile .edit::-webkit-outer-spin-button, .tile .edit::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.tile .bounds { font-size: 9.5px; color: var(--ghost); white-space: nowrap; margin-left: 8px; }

section { margin-top: 26px; }
details.spare { margin-top: 26px; }
details.spare > summary { cursor: pointer; list-style: none; font-size: 10px; letter-spacing: .26em; color: var(--faint); padding: 8px 0; }
details.spare > summary::-webkit-details-marker { display: none; }
details.spare > summary::before { content: "+ "; }
details.spare[open] > summary::before { content: "- "; }

/* ---------- 登录 / 故障 ---------- */
.gate-screen { max-width: 440px; margin: 0 auto; padding: 88px 22px 0; text-align: center; }
.gate-screen h1 { font-family: var(--sans); font-weight: 400; font-size: 26px; color: var(--ink-hi); margin: 0 0 14px; }
.gate-screen p { font-family: var(--sans); color: var(--dim); font-size: 13.5px; margin: 0; }
.gate-screen ol { text-align: left; font-family: var(--sans); color: var(--dim); font-size: 13.5px; line-height: 2.05; padding-left: 22px; margin: 24px 0 26px; }
.gate-screen ol b { color: var(--ink); font-weight: 400; }
.field { text-align: left; margin-bottom: 14px; }
.field label { display: block; font-size: 10px; letter-spacing: .22em; color: var(--faint); margin-bottom: 7px; }
.field .hint { font-family: var(--sans); font-size: 11.5px; color: var(--ghost); margin-top: 7px; line-height: 1.6; }
.addr { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--ink); font: 400 15px/1 var(--mono); letter-spacing: .04em; padding: 13px 14px; outline: none; }
.addr:focus { border-color: var(--bright); }
.code { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--ink-hi); font: 400 28px/1 var(--mono); letter-spacing: .42em; text-align: center; padding: 19px 0 19px .42em; outline: none; }
.code:focus { border-color: var(--bright); }
.code::placeholder { color: #2b353c; }
.btn { margin-top: 12px; width: 100%; padding: 14px; cursor: pointer; background: var(--ok); color: #0b1710; border: none; font: 400 14px/1 var(--sans); letter-spacing: .1em; }
.btn:disabled { opacity: .4; cursor: wait; }
.err { color: var(--alert); font-size: 12.5px; margin-top: 15px; min-height: 1.2em; font-family: var(--sans); }
.mini { background: none; border: 1px solid var(--line); color: var(--faint); padding: 5px 11px; cursor: pointer; font: inherit; font-size: 10px; letter-spacing: .14em; }
.mini:hover { border-color: #33414b; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body><div class="wrap"><div id="app"></div></div>
<script>
const url = new URL(location.href);
let TOKEN = url.searchParams.get('t');
if (TOKEN) { localStorage.setItem('dashToken', TOKEN); history.replaceState(null, '', url.pathname); }
else { TOKEN = localStorage.getItem('dashToken'); }

const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'x-dash-token': TOKEN ?? '', ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}

let timer = null, lastFetch = null, picked = null, state = null, spareOpen = false;
let editing = false, draft = null;   // draft = 编辑中的外观，保存前不落盘

const bgLayer = document.createElement('div');
bgLayer.id = 'bg';
document.body.prepend(bgLayer);

// 背景。图片和纯色两种；图片的模糊/变暗加在背景层上，不碰内容。
function paintBackground(bg) {
  if (!bg || bg.kind === undefined) { bgLayer.innerHTML = ''; document.body.style.background = ''; return; }
  if (bg.kind === 'color') {
    bgLayer.innerHTML = '';
    document.body.style.background = bg.color;
    return;
  }
  document.body.style.background = '';
  bgLayer.innerHTML =
    `<div class="img" style="background-image:url('/bg?t=${encodeURIComponent(TOKEN)}&v=${bgVersion}');`
    + `filter:blur(${bg.blur || 0}px)"></div>`
    + `<div class="veil" style="opacity:${bg.dim ?? 0}"></div>`;
}
let bgVersion = 0;

const LED = { clear: 'ok', bright: 'bright', blocked: 'alert', unconfigured: 'dead', unknown: 'alert' };

function render(s) {
  if (s.loggedIn === false) return renderGate(s.address);
  if (!s.ok) return renderTrouble(s.error, s.address);
  state = s; lastFetch = Date.now();

  const fp = s.floorplan;
  const rooms = fp?.rooms ?? [];
  // 默认选中受阻的那间 —— 人打开页面就是为了看它。
  if (!picked || !rooms.some((r) => r.title === picked)) {
    picked = (rooms.find((r) => r.state === 'blocked') ?? rooms.find((r) => r.state !== 'unconfigured') ?? rooms[0])?.title ?? null;
  }
  const sel = rooms.find((r) => r.title === picked) ?? null;
  const hl = s.headline;

  app.innerHTML = `
    <div class="bar top">
      <span class="led ${hl && hl.state === 'blocked' ? 'alert' : 'ok'}"></span>
      <span class="zh" style="letter-spacing:.14em;color:#8fa0aa">模式看板</span>
      <span class="grow"></span>
      <button class="mini" id="editbtn">${editing ? '退出编辑' : '编辑'}</button>
      <span id="clock"></span>
    </div>
    ${editing ? renderEditBar() : ''}
    ${hl ? renderBand(hl) : ''}
    <div class="body">
      ${fp ? `<div class="col plan">
        <div class="cap">${esc(fp.title ?? '房间')}</div>
        <div class="plan-grid" style="width:${planSize(rooms).w}px;height:${planSize(rooms).h}px">
          ${rooms.map(renderRoom).join('')}
        </div>
        <div class="legend">
          <span><i class="led sm ok"></i>没发现阻碍</span>
          <span><i class="led sm bright"></i>够亮了</span>
          <span><i class="led sm alert"></i>受阻</span>
          <span><i class="led sm dead"></i>未配置</span>
        </div>
      </div>` : ''}
      <div class="col detail">${sel ? renderChain(sel) : ''}</div>
    </div>
    <div style="padding:0 22px 30px">
      ${(s.groups ?? []).map(renderGroup).join('')}
      ${renderSpare(s.unmapped)}
    </div>
    <div class="bar bot">
      <span id="ago">刚刚更新</span>
      <span class="grow"></span>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">开机自启
        <input type="checkbox" id="autostart" style="accent-color:var(--ok);width:14px;height:14px">
      </label>
      <button class="mini" id="quit">退出</button>
    </div>`;

  paintBackground(editing ? draft?.background : s.layout?.background);
  wireRooms(); wireToggles(); wireNumbers(); wireThresholds(); wireAutostart(); wireQuit(); wireSpare();
  wireEdit(); wireDrag(); tick();
}

// 子元素全绝对定位了，容器得自己算出高宽。
function planSize(items) {
  let w = 0, h = 0;
  for (const it of items) {
    const p = placed(draft?.rooms?.[it.title] ?? draft?.tiles?.[it.ref]) ?? it;
    w = Math.max(w, (p.x ?? 0) + (p.w ?? 0));
    h = Math.max(h, (p.y ?? 0) + (p.h ?? 0));
  }
  return { w: w + 2, h: h + 2 };
}

function placed(p) {
  return p && ['x', 'y', 'w', 'h'].every((k) => typeof p[k] === 'number') ? p : null;
}

function renderBand(hl) {
  return `<div class="band">
    <div class="where">${hl.title ? esc(hl.title) + ' &middot; 自动化受阻' : '全部房间'}</div>
    <div class="say zh">${esc(hl.say)}</div>
    ${hl.alsoBlocked.length ? `<div class="also zh">另外 ${hl.alsoBlocked.length} 处也受阻：${esc(hl.alsoBlocked.join('、'))}</div>` : ''}
  </div>`;
}

function renderRoom(r) {
  const p = placed(draft?.rooms?.[r.title]) ?? r;
  const pos = `left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px`;
  const lx = r.lux ? `<span class="lx">本地 ${esc(r.lux.localValue)} / ${esc(r.lux.localThreshold)} &middot; 全局 ${esc(r.lux.globalValue)} / ${esc(r.lux.zoneThreshold)}</span>` : '';
  // 编辑模式下一律用 div —— button 会吞掉拖拽用的 pointer 事件。
  const tag = editing || r.state === 'unconfigured' ? 'div' : 'button';
  return `<${tag} class="room ${r.state}${r.title === picked ? ' sel' : ''}" style="${pos}"
      data-room="${esc(r.title)}"${tag === 'button' ? ' type="button"' : ''}>
    <span class="nm"><i class="led ${LED[r.state]}"></i><b>${esc(r.title)}</b></span>
    <span style="display:flex;flex-direction:column;gap:3px">
      <span class="st zh">${esc(r.say)}</span>${lx}
    </span>
  </${tag}>`;
}

function renderChain(r) {
  if (!r.chain.length) return `<div class="cap">${esc(r.title)}</div><div class="note zh">这个房间没写进配置，所以没有判定链。</div>`;
  const NOTE = {
    gate: { pass: '通过', break: '断在这里', skip: '没走到这一步', missing: '网关上没有这一项' },
    lux:  { pass: '成立 → 会开灯', fail: '不成立', skip: '没走到这一步', missing: '照度读不到' },
  };
  return `<div class="cap">${esc(r.title)} &middot; 开灯要过的 ${r.chain.length} 道${r.rule ? ` &middot; 规则 ${esc(r.rule)}` : ''}</div>
    ${r.chain.map((g) => `<div class="gate ${g.status}">
      <i class="led sm ${g.status === 'pass' ? 'ok' : (g.status === 'skip' || g.status === 'fail') ? 'dead' : 'alert'}"></i>
      <span class="g-name zh">${gateTitle(g)}</span>
      <span class="g-ref">${esc(g.ref)}${g.value !== undefined ? ' = ' + esc(g.value) : ''}</span>
      <span class="g-note zh">${NOTE[g.kind ?? 'gate'][g.status] ?? ''}</span>
    </div>`).join('')}
    <div class="note zh">
      照度两道是「或」：任一成立就开灯。<br>
      ${r.luxKnown === false ? '照度读不到 —— 这两道判不了。' : '照度由探针写入，不是实时值。'}
    </div>`;
}

// 阈值那个数字做成可点的 —— 就在它判失败的那一行上改，不用跑去别处找。
function gateTitle(g) {
  if (!g.edit) return esc(g.title);
  const head = esc(g.title.replace(/[\d.]+$/, ''));
  return `${head}<button type="button" class="thr" data-rule="${esc(g.edit.rule)}" data-node="${esc(g.edit.node)}"
    data-value="${esc(g.edit.value)}" data-min="${esc(g.edit.min)}" data-max="${esc(g.edit.max)}"
    title="点一下改这个阈值">${esc(g.edit.value)}</button>`;
}

function renderGroup(g) {
  const cards = g.cards.map((c) => ({ ...c, ref: cardRef(c) }));
  // 摆过位置的就用画布；一张都没摆过就保持自动排版。
  const anyPlaced = cards.some((c) => placed(draft?.tiles?.[c.ref] ?? c));
  const size = anyPlaced ? planSize(cards.map((c) => ({ ...(placed(draft?.tiles?.[c.ref] ?? c) ?? {}), ref: c.ref }))) : null;

  return `<section>
    <div class="cap">${esc(g.title)}</div>
    <div class="tiles${anyPlaced ? ' placed' : ''}"${size ? ` style="height:${size.h}px"` : ''}>${
      cards.map((c) => renderCard(c, anyPlaced)).join('')}</div>
  </section>`;
}

function cardRef(c) {
  return c.kind === 'rule' ? `rule.${c.ruleId}` : `${c.scope}.${c.id}`;
}

function renderCard(c, positioned) {
  const ref = c.kind === 'rule' ? `规则 ${esc(c.ruleId)}` : `${esc(c.scope)}.${esc(c.id)}`;
  const head = `<span class="t">${esc(c.title)}</span>`;
  const key = c.ref ?? cardRef(c);
  const p = positioned ? placed(draft?.tiles?.[key] ?? c) : null;
  const box = p ? ` style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px"` : '';
  const tag = ` data-tile="${esc(key)}"${box}`;
  if (c.missing) return `<div class="tile bad"${tag}>${head}<span class="v">网关上没有</span></div>`;
  if (c.kind === 'rule') return `<div class="tile ${c.enable ? 'on' : ''}" title="${ref}"${tag}>${head}<span class="v">${c.enable ? '启用中' : '已停用'}</span></div>`;
  if (c.kind === 'toggle') {
    const on = c.value === c.on;
    // 编辑模式下用 div —— button 会吞掉拖拽的 pointer 事件。
    return `<${editing ? 'div' : 'button'} class="tile ${editing ? '' : 'act '}${on ? 'on' : ''}" role="switch" aria-checked="${on}" title="${ref}"
      data-scope="${esc(c.scope)}" data-id="${esc(c.id)}" data-want="${esc(on ? c.off : c.on)}"${tag}>${head}<span class="v">${on ? 'ON' : 'OFF'}</span></${editing ? 'div' : 'button'}>`;
  }
  const unit = c.unit ? `<span class="u">${esc(c.unit)}</span>` : '';
  if (c.kind === 'number') {
    return `<${editing ? 'div' : 'button'} class="tile ${editing ? '' : 'act num'}" title="${ref}"
      data-scope="${esc(c.scope)}" data-id="${esc(c.id)}" data-min="${esc(c.min)}" data-max="${esc(c.max)}"
      data-value="${esc(c.value)}"${tag}>${head}<span class="v">${esc(c.value)}${unit}</span></${editing ? 'div' : 'button'}>`;
  }
  return `<div class="tile" title="${ref}"${tag}>${head}<span class="v">${esc(c.value)}${unit}</span></div>`;
}

function renderSpare(u) {
  if (!u || (!u.variables.length && !u.rules.length)) return '';
  const tiles = [
    ...u.rules.map((r) => ({ kind: 'rule', title: r.title, ruleId: r.ruleId, enable: r.enable })),
    ...u.variables.map((v) => ({ kind: 'readonly', title: v.title, scope: v.scope, id: v.id, value: v.value })),
  ];
  // 展开状态要跨渲染保留 —— 每 10 秒轮询一次，重画时把它合上会很烦人。
  return `<details class="spare"${spareOpen ? ' open' : ''}><summary>未归类 ${tiles.length} 项</summary>
    <div class="note zh" style="margin:4px 0 12px">这些没写进配置，所以没有分组也没有结论 —— 但不会被藏起来。</div>
    <div class="tiles">${tiles.map(renderCard).join('')}</div></details>`;
}

function renderGate(address, msg) {
  const ask = address !== undefined;   // undefined = 地址被钉住（mgs serve），不用问
  const addr = address ?? '';
  app.innerHTML = `<div class="gate-screen">
    <h1>${!ask || addr ? '要一个新的登录码' : '连上中枢'}</h1>
    <p>${!ask || addr ? '中枢的登录码短时有效，隔一阵就要重取一次。' : '第一次用，先告诉它中枢在哪。'}</p>
    <ol>
      <li>打开<b>米家 App</b></li><li>进<b>中枢网关</b>那台设备</li>
      <li>点<b>中枢功能 &rarr; 自动化极客版</b></li><li>抄下页面上那个<b>6 位数字</b></li>
    </ol>
    ${!ask ? '' : `<div class="field">
      <label>中枢地址</label>
      <input class="addr" id="addr" value="${esc(addr)}" placeholder="192.168.1.100" spellcheck="false" autocapitalize="off">
      <div class="hint">连不上就改这里 &mdash; 路由器重启后地址可能变了。
        填米家 App 里显示的那个 IP；或者填中枢的 mDNS 实例名，那个换 IP 也不用改。</div>
    </div>`}
    <div class="field">
      <label>6 位登录码</label>
      <input class="code" id="code" inputmode="numeric" maxlength="6" placeholder="······">
    </div>
    <button class="btn" id="go">登录</button>
    <div class="err" id="err">${esc(msg ?? '')}</div></div>`;

  const addrEl = document.getElementById('addr'), code = document.getElementById('code'),
        go = document.getElementById('go'), err = document.getElementById('err');
  const body = () => (addrEl ? { address: addrEl.value, code: code.value } : { code: code.value });

  const submit = async () => {
    if (!/^\d{6}$/.test(code.value)) { err.textContent = '登录码要 6 位数字'; code.focus(); return; }
    go.disabled = true; err.textContent = '';
    const r = await api('/api/login', body())
      .catch((e) => ({ ok: false, error: e.message }));
    go.disabled = false;
    if (r.ok) return poll();
    // 码是一次性的，清掉；地址留着 —— 他可能正是要在这儿改错字。
    code.value = '';
    if (addrEl && r.address !== undefined) addrEl.value = r.address;
    err.textContent = r.error ?? '登录失败';
    code.focus();
  };

  go.onclick = submit;
  for (const el of [addrEl, code]) if (el) el.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  // 地址已经有了就直接落在登录码上 —— 多数时候地址不用动。
  (addr || !addrEl ? code : addrEl).focus();
}

function renderTrouble(message, address) {
  app.innerHTML = `<div class="gate-screen"><h1>连不上中枢</h1>
    <p>${esc(message ?? '')}</p>
    <p style="color:var(--faint);font-size:12.5px;margin-top:20px">路由器和中枢网关都通电了吗？会自动重试。</p>
    <button class="mini" id="fix" style="margin-top:20px">改中枢地址</button></div>`;
  const b = document.getElementById('fix');
  // 路由器重启后地址会变，这是最常见的「连不上」—— 得给一条自己改的出口。
  if (b) b.onclick = () => { clearTimeout(timer); renderGate(address ?? '', message); };
}

function wireSpare() {
  const d = app.querySelector('details.spare');
  if (d) d.ontoggle = () => { spareOpen = d.open; };
}

function wireRooms() {
  for (const el of app.querySelectorAll('.room[data-room]')) {
    el.onclick = () => { picked = el.dataset.room; render(state); };
  }
}

async function writeVar(el, value) {
  if (el.getAttribute('aria-busy') === 'true') return;
  el.setAttribute('aria-busy', 'true');
  const r = await api('/api/variable', { scope: el.dataset.scope, id: el.dataset.id, value })
    .catch((e) => ({ ok: false, error: e.message }));
  el.removeAttribute('aria-busy');
  if (!r.ok) alert(r.error ?? '写入失败');
  poll();   // 不做乐观更新：立刻重读，显示网关的真实值
}

function wireToggles() {
  for (const el of app.querySelectorAll('.tile.act:not(.num)')) {
    el.onclick = () => writeVar(el, Number(el.dataset.want));
  }
}

// 数值卡片：点一下变成输入框，回车才写。
//
// 失焦按取消处理，不按提交 —— 这是在别人家里改正在生效的配置，
// 手滑点开别处不该顺手把一个亮度改掉。
function wireNumbers() {
  for (const el of app.querySelectorAll('.tile.act.num')) {
    el.onclick = () => {
      if (el.classList.contains('editing')) return;
      const slot = el.querySelector('.v');
      const min = Number(el.dataset.min), max = Number(el.dataset.max);
      const before = el.dataset.value;

      el.classList.add('editing');
      slot.innerHTML = `<input class="edit" type="number" inputmode="numeric" value="${before}" min="${min}" max="${max}">`
        + `<span class="bounds">${min}–${max} 回车</span>`;
      const input = slot.querySelector('.edit');
      input.focus(); input.select();

      const done = (commit) => {
        el.classList.remove('editing');
        const v = Number(input.value);
        if (!commit || input.value === '' || Number.isNaN(v) || v === Number(before)) return poll();
        if (v < min || v > max) { alert(`要在 ${min} 到 ${max} 之间`); return poll(); }
        writeVar(el, v);
      };

      input.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); done(true); }
        if (e.key === 'Escape') { e.preventDefault(); done(false); }
      };
      input.onblur = () => done(false);
      input.onclick = (e) => e.stopPropagation();
    };
  }
}

// 改阈值 = 写规则图，看板唯一一处。所以比改变量更谨慎：
// 回车才写，失焦取消，写完服务端会回读整张图比对，不止改了这一处就报出来。
function wireThresholds() {
  for (const btn of app.querySelectorAll('button.thr')) {
    btn.onclick = (e) => {
      e.stopPropagation();
      const { rule, node, value, min, max } = btn.dataset;
      const input = document.createElement('input');
      Object.assign(input, { className: 'thr-edit', type: 'number', value, min, max });
      btn.replaceWith(input);
      input.focus(); input.select();

      const done = async (commit) => {
        input.onblur = null;
        const v = Number(input.value);
        if (!commit || input.value === '' || Number.isNaN(v) || v === Number(value)) return poll();
        if (v < Number(min) || v > Number(max)) { alert(`要在 ${min} 到 ${max} 之间`); return poll(); }
        const r = await api('/api/threshold', { rule, node, value: v }).catch((err) => ({ ok: false, error: err.message }));
        if (!r.ok) alert(r.error ?? '写入失败');
        poll();
      };
      input.onkeydown = (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); done(true); }
        if (ev.key === 'Escape') { ev.preventDefault(); done(false); }
      };
      input.onblur = () => done(false);
    };
  }
}

function wireAutostart() {
  const box = document.getElementById('autostart');
  if (!box) return;
  api('/api/autostart').then((r) => { if (r.ok) box.checked = r.enabled; });
  box.onchange = async () => {
    box.disabled = true;
    const r = await api('/api/autostart', { enabled: box.checked });
    box.disabled = false;
    if (r.ok) box.checked = r.enabled;
  };
}

function wireQuit() {
  const b = document.getElementById('quit');
  if (!b) return;
  b.onclick = async () => {
    b.disabled = true;
    await api('/api/quit', {}).catch(() => {});
    clearTimeout(timer);
    app.innerHTML = `<div class="gate-screen"><h1>看板已退出</h1>
      <p>要再看，从「应用程序」里重新打开「模式看板」。</p></div>`;
  };
}

function renderEditBar() {
  const bg = draft.background ?? {};
  return `<div class="editbar">
    <span>编辑中 &middot; 拖动挪位置，拖右下角改大小</span>
    <label>背景
      <select id="bgkind">
        <option value=""${!bg.kind ? ' selected' : ''}>无</option>
        <option value="image"${bg.kind === 'image' ? ' selected' : ''}>图片</option>
        <option value="color"${bg.kind === 'color' ? ' selected' : ''}>纯色</option>
      </select></label>
    ${bg.kind === 'image' ? `
      <button class="btn-s" id="bgpick">选图</button>
      <input type="file" id="bgfile" accept="image/png,image/jpeg,image/webp" hidden>
      <label>模糊 <input type="range" id="bgblur" min="0" max="40" value="${bg.blur ?? 0}"></label>
      <label>变暗 <input type="range" id="bgdim" min="0" max="95" value="${Math.round((bg.dim ?? 0) * 100)}"></label>` : ''}
    ${bg.kind === 'color' ? `<input type="color" id="bgcolor" value="${bg.color ?? '#0d1013'}">` : ''}
    <span class="grow"></span>
    <button class="btn-s" id="ecancel">取消</button>
    <button class="btn-s go" id="esave">保存</button>
  </div>`;
}

// 进编辑模式时，把当前排版量出来存进 draft ——
// 卡片本来是自动排的，没有坐标；量一次之后它们就都是绝对定位了。
function seedDraft() {
  draft = structuredClone(state.layout ?? {});
  draft.rooms ??= {};
  draft.tiles ??= {};

  for (const r of state.floorplan?.rooms ?? []) {
    draft.rooms[r.title] ??= { x: r.x, y: r.y, w: r.w, h: r.h };
  }
  // 只量分组里的卡片；「未归类」那堆不参与摆放。
  for (const el of app.querySelectorAll('section .tiles .tile[data-tile]')) {
    const key = el.dataset.tile;
    if (draft.tiles[key]) continue;
    const b = el.getBoundingClientRect(), c = el.closest('.tiles').getBoundingClientRect();
    draft.tiles[key] = {
      x: Math.round(b.left - c.left), y: Math.round(b.top - c.top),
      w: Math.round(b.width), h: Math.round(b.height),
    };
  }
}

function wireEdit() {
  const btn = document.getElementById('editbtn');
  if (btn) btn.onclick = () => {
    if (editing) return exitEdit(false);
    seedDraft(); editing = true; document.body.classList.add('editing'); render(state);
  };
  if (!editing) return;

  const $ = (id) => document.getElementById(id);
  const redraw = () => render(state);

  $('ecancel').onclick = () => exitEdit(false);
  $('esave').onclick = () => exitEdit(true);

  $('bgkind').onchange = (e) => {
    const kind = e.target.value;
    draft.background = kind === 'color' ? { kind: 'color', color: draft.background?.color ?? '#0d1013' }
      : kind === 'image' ? { kind: 'image', image: draft.background?.image ?? '', blur: draft.background?.blur ?? 0, dim: draft.background?.dim ?? 0.35 }
      : undefined;
    redraw();
  };
  if ($('bgcolor')) $('bgcolor').oninput = (e) => { draft.background.color = e.target.value; paintBackground(draft.background); };
  if ($('bgblur')) $('bgblur').oninput = (e) => { draft.background.blur = Number(e.target.value); paintBackground(draft.background); };
  if ($('bgdim')) $('bgdim').oninput = (e) => { draft.background.dim = Number(e.target.value) / 100; paintBackground(draft.background); };
  if ($('bgpick')) {
    $('bgpick').onclick = () => $('bgfile').click();
    $('bgfile').onchange = async (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      const dataUrl = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(f); });
      const r = await api('/api/background', { dataUrl }).catch((err) => ({ ok: false, error: err.message }));
      if (!r.ok) return alert(r.error ?? '上传失败');
      // 图片存在服务端了，刷一下缓存里的版本号让 /bg 重新取
      bgVersion++;
      draft.background = { ...draft.background, ...r.layout.background };
      redraw();
    };
  }
}

async function exitEdit(save) {
  if (save) {
    const r = await api('/api/layout', draft).catch((e) => ({ ok: false, error: e.message }));
    if (!r.ok) return alert(r.error ?? '保存失败');
  }
  editing = false; draft = null;
  document.body.classList.remove('editing');
  poll();
}

// 拖动挪位置，拖右下角改大小。对齐到 4px 网格，摆出来不至于歪歪扭扭。
function wireDrag() {
  if (!editing) return;
  const snap = (v) => Math.round(v / 4) * 4;

  for (const el of app.querySelectorAll('.room[data-room], section .tiles .tile[data-tile]')) {
    const key = el.dataset.room ?? el.dataset.tile;
    const bag = el.dataset.room ? draft.rooms : draft.tiles;
    const p = bag[key];
    if (!p) continue;

    el.onpointerdown = (e) => {
      if (e.button !== 0) return;
      const r = el.getBoundingClientRect();
      const resizing = e.clientX > r.right - 16 && e.clientY > r.bottom - 16;
      // 指针起点和方块位置分开记 —— 都叫 x/y 的话展开就互相覆盖了。
      const from = { px: e.clientX, py: e.clientY, x: p.x, y: p.y, w: p.w, h: p.h };

      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      e.preventDefault();

      el.onpointermove = (ev) => {
        const dx = snap(ev.clientX - from.px), dy = snap(ev.clientY - from.py);
        if (resizing) {
          p.w = Math.max(60, from.w + dx);
          p.h = Math.max(30, from.h + dy);
        } else {
          // 夹在容器里 —— 拖出右边会让整页横滚，那是最难受的一种坏掉。
          const lim = (el.closest('.plan-grid, .tiles')?.clientWidth ?? 4000) - p.w;
          p.x = Math.min(Math.max(0, lim), Math.max(0, from.x + dx));
          p.y = Math.max(0, from.y + dy);
        }
        Object.assign(el.style, { left: p.x + 'px', top: p.y + 'px', width: p.w + 'px', height: p.h + 'px' });
      };
      el.onpointerup = () => {
        el.classList.remove('dragging');
        el.onpointermove = null; el.onpointerup = null;
        grow(el);
      };
    };
  }
}

// 拖出容器就把容器撑大。
function grow(el) {
  const box = el.closest('.plan-grid, .tiles');
  if (!box) return;
  let w = 0, h = 0;
  for (const c of box.children) { w = Math.max(w, c.offsetLeft + c.offsetWidth); h = Math.max(h, c.offsetTop + c.offsetHeight); }
  box.style.height = h + 2 + 'px';
  if (box.classList.contains('plan-grid')) box.style.width = w + 2 + 'px';
}

function tick() {
  const ago = document.getElementById('ago'), clock = document.getElementById('clock');
  if (clock) clock.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  if (ago && lastFetch) {
    const s = Math.round((Date.now() - lastFetch) / 1000);
    ago.textContent = s < 5 ? '刚刚更新' : `${s} 秒前更新`;
  }
}
setInterval(tick, 1000);

async function poll() {
  clearTimeout(timer);
  // 编辑期间不拉数据 —— 每 10 秒重画一次会把拖到一半的东西冲掉。
  if (editing) { timer = setTimeout(poll, 10000); return; }
  try { render(await api('/api/state')); } catch (e) { renderTrouble(e.message); }
  timer = setTimeout(poll, 10000);
}

if (!TOKEN) {
  app.innerHTML = `<div class="gate-screen"><h1>请从应用图标打开</h1>
    <p>这个地址需要一个访问口令，直接输网址进不来。</p></div>`;
} else { poll(); }
</script>
</body>
</html>
